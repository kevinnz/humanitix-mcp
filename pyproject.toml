[project]
name = "humanitix-mcp"
version = "0.1.0"
description = "Humanitix MCP Server (Phase 1 scaffold)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Kevin Alcock", email = "kevin@akatiposec.com" },
]
keywords = ["humanitix", "mcp", "events"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "mcp[cli]",
    "httpx",
    "pydantic",
    "python-dotenv",
]

[project.scripts]
humanitix-mcp = "humanitix_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/humanitix_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
